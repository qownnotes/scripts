name: Generate script metadata index

on:
  push:
    branches: [main]

jobs:
  build:
    # the "metadata-index" release this uploads to only exists on the upstream
    # repo; forks don't get GitHub Releases via git, so skip there.
    if: github.repository == 'qownnotes/scripts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Generate index
        run: ./.github/workflows/scripts/generate-index.sh
      - name: Upload index.json
        run: |
          gh release upload metadata-index index.json --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
